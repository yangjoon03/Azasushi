<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아자스시 프로젝트 시연</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; }
        header { text-align: center; margin-bottom: 40px; }
        .team-info { color: #555; font-size: 0.9em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { color: #d32f2f; margin-bottom: 15px; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #d32f2f; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn:hover { background-color: #b71c1c; }
    </style>
</head>
<body>

<header>
    <h1>🍣 아자스시(AjaSushi)</h1>
    <p class="team-info">팀원: 양준영, 김소현, 유채연</p>
</header>

<div class="grid">
    <!-- 초밥 제작 -->
    <div class="card">
        <h3>초밥 제작</h3>
        <p>재료를 선택하고 초밥을 만드는 핵심 메커니즘 시연 영상입니다.</p>
        <a href="영상링크1.mp4" class="btn">영상 보기</a>
    </div>

    <!-- 이동 -->
    <div class="card">
        <h3>플레이어 이동</h3>
        <p>캐릭터의 이동 시연 영상입니다.</p>
        <a href="영상링크2.mp4" class="btn">영상 보기</a>
    </div>

    <!-- 제출 및 스코어 UI -->
    <div class="card">
        <h3>제출 및 스코어 UI</h3>
        <p>완성된 초밥 제출과 스코어 집계 UI 시스템 시연 영상입니다.</p>
        <a href="영상링크3.mp4" class="btn">영상 보기</a>
    </div>
</div>

</body>
</html>
